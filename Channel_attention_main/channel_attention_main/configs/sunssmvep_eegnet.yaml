# general
dataset_name: "sun_ssmvep"  
subject_ids: "all"  # either "all" or integer
max_epochs: 250
seed: 0

# preprocessing
preprocessing:
  sfreq: 250
  low_cut: 0
  high_cut: 40
  start: 0
  stop: 0  # 维持4 second trial
  pick_ch: ['EEG26',"EEG28","EEG30"]  # 对应C3, Cz, C4
  z_scale: True
  batch_size: 64

# model
model: "EEGNet"
model_kwargs:
  n_classes: 3
  in_channels: 60
  input_window_samples: 1000
  F1: 8
  D: 2
  F2: 16  # F1 * D
  drop_prob: 0.5  # LOSO: 0.25
  kernel_length: 32
  pool_time_length: 4
  pool_time_stride: 4
  kernel_length_dw_sep: 16
  lr: 0.001
  weight_decay: 0.0
  optimizer: "adam"
  scheduler: False